[package]
name = "vba-rs"
description = "Stable public facade of vba-rs: a strict, embeddable Rust implementation of Microsoft VBA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "vba"

[features]
# Nothing is on by default: the default build is the pure interpreter. No
# feature grants a capability; each still needs an explicit host `Policy`
# grant at run time (see docs/public-api.md).
default = []
# The Win32 behavior catalog and portable shims (`vba::raw::winapi`). Off by
# default to keep the default dependency graph and API surface minimal; it is
# pure (no ambient authority) and enabling it changes no behavior by itself.
winapi = ["dep:vba-winapi"]
# The dynamic native call stage of the `Declare` bridge (libloading + libffi,
# the only `unsafe` in the workspace). Off by default; it additionally needs a
# host-issued permission and the `NativeDeclare` capability.
native-call = ["vba-ffi/native-call"]
# The opt-in Wine bridge client (`vba::raw::wine`). Starts nothing by itself.
wine = ["winapi", "dep:vba-wine"]

[dependencies]
vba-ast.workspace = true
vba-automation.workspace = true
vba-core.workspace = true
vba-diagnostics.workspace = true
vba-ffi.workspace = true
vba-format.workspace = true
vba-host.workspace = true
vba-ir.workspace = true
vba-lexer.workspace = true
vba-profile.workspace = true
vba-project.workspace = true
vba-runtime.workspace = true
vba-sema.workspace = true
vba-source.workspace = true
vba-stdlib.workspace = true
vba-syntax.workspace = true
vba-value.workspace = true
vba-vm.workspace = true
vba-winapi = { workspace = true, optional = true }
vba-wine = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
