[package]
name = "vba-typelib"
description = "Reader for Windows type libraries (MSFT format, .tlb/.olb files and TYPELIB resources of PE files) and a model for early-bound binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["sema", "automation"]
# Adapter implementing `vba_sema::TypeProvider` for a loaded library.
sema = ["dep:vba-sema", "dep:vba-value"]
# Per-interface dispatch tables for `vba-automation` objects.
automation = ["sema", "dep:vba-automation"]

[dependencies]
bitflags.workspace = true
encoding_rs.workspace = true
object.workspace = true
thiserror.workspace = true
vba-automation = { workspace = true, optional = true }
vba-sema = { workspace = true, optional = true }
vba-value = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
vba-diagnostics.workspace = true
vba-host.workspace = true
vba-ir.workspace = true
vba-profile.workspace = true
vba-project.workspace = true
vba-scripting.workspace = true
vba-stdlib.workspace = true
vba-vm.workspace = true

[lints]
workspace = true
