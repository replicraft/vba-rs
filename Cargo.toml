[workspace]
resolver = "3"
members = ["apps/*", "crates/*/*", "tooling/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/replicraft/vba-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Internal crates
[workspace.dependencies]
vba-ast = { path = "crates/language/vba-ast" }
vba-automation = { path = "crates/interoperability/vba-automation" }
vba-core = { path = "crates/foundation/vba-core" }
vba-diagnostics = { path = "crates/foundation/vba-diagnostics" }
vba-ffi = { path = "crates/interoperability/vba-ffi" }
vba-format = { path = "crates/formats/vba-format" }
vba-host = { path = "crates/hosts/vba-host" }
vba-ir = { path = "crates/language/vba-ir" }
vba-lexer = { path = "crates/language/vba-lexer" }
vba-lsp-core = { path = "crates/language/vba-lsp-core" }
vba-pcode = { path = "crates/formats/vba-pcode" }
vba-pcode-ir = { path = "crates/language/vba-pcode-ir" }
vba-profile = { path = "crates/foundation/vba-profile" }
vba-project = { path = "crates/model/vba-project" }
vba-rs = { path = "crates/api/vba-rs" }
vba-runtime = { path = "crates/runtime/vba-runtime" }
vba-sema = { path = "crates/language/vba-sema" }
vba-scripting = { path = "crates/runtime/vba-scripting" }
vba-source = { path = "crates/foundation/vba-source" }
vba-stdlib = { path = "crates/runtime/vba-stdlib" }
vba-syntax = { path = "crates/language/vba-syntax" }
vba-typelib = { path = "crates/interoperability/vba-typelib" }
vba-value = { path = "crates/runtime/vba-value" }
vba-vm = { path = "crates/runtime/vba-vm" }
vba-winapi = { path = "crates/windows/vba-winapi" }
vba-wine = { path = "crates/windows/vba-wine" }

# Error handling
thiserror = "2"

# Data structures
bitflags = "2"
indexmap = "2"

# Binary parsing
cfb = "0.15"
encoding_rs = "0.8"
uuid = "1"

# Executable file formats
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }

# Archives and XML
flate2 = "1"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Command-line interface
annotate-snippets = "0.12"
clap = { version = "4", features = ["derive"] }

# Native interop
libffi = "5.2.0"
libloading = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole"] }

# Windows metadata
windows-default = { version = "0.100.0", default-features = false }
windows-metadata = { version = "0.100.0", default-features = false }

# Language server protocol
lsp-server = "0.10"
lsp-types = "0.97"
serde = "1"
serde_json = "1"

# Testing
assert_cmd = "2"
expect-test = "1.5"
jiff = { version = "0.2", default-features = false, features = ["std"] }
proptest = "1.12"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
