[workspace]
resolver = "3"
members = ["apps/*", "crates/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Internal crates
[workspace.dependencies]
vba-ast = { path = "crates/language/vba-ast" }
vba-automation = { path = "crates/interoperability/vba-automation" }
vba-core = { path = "crates/foundation/vba-core" }
vba-diagnostics = { path = "crates/foundation/vba-diagnostics" }
vba-ffi = { path = "crates/interoperability/vba-ffi" }
vba-format = { path = "crates/formats/vba-format" }
vba-host = { path = "crates/hosts/vba-host" }
vba-lexer = { path = "crates/language/vba-lexer" }
vba-profile = { path = "crates/foundation/vba-profile" }
vba-project = { path = "crates/model/vba-project" }
vba-source = { path = "crates/foundation/vba-source" }
vba-syntax = { path = "crates/language/vba-syntax" }
vba-value = { path = "crates/runtime/vba-value" }
vba-winapi = { path = "crates/windows/vba-winapi" }
vba-wine = { path = "crates/windows/vba-wine" }

# Error handling
thiserror = "2"

# Binary parsing
cfb = "0.15"
encoding_rs = "0.8"
uuid = "1"

# Command-line interface
clap = { version = "4", features = ["derive"] }

# Testing
assert_cmd = "2"
expect-test = "1.5"
proptest = "1.12"
tempfile = "3"
