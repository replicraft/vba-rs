[workspace]
resolver = "3"
members = ["apps/*", "crates/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Internal crates
[workspace.dependencies]
vba-format = { path = "crates/formats/vba-format" }

# Error handling
thiserror = "2"

# Command-line interface
clap = { version = "4", features = ["derive"] }
