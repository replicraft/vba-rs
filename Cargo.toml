[workspace]
resolver = "3"
members = ["apps/*", "crates/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Internal crates
[workspace.dependencies]
vba-diagnostics = { path = "crates/foundation/vba-diagnostics" }
vba-format = { path = "crates/formats/vba-format" }
vba-lexer = { path = "crates/language/vba-lexer" }
vba-profile = { path = "crates/foundation/vba-profile" }
vba-source = { path = "crates/foundation/vba-source" }
vba-value = { path = "crates/runtime/vba-value" }

# Error handling
thiserror = "2"

# Command-line interface
clap = { version = "4", features = ["derive"] }

# Testing
proptest = "1.12"
